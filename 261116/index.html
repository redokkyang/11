<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			#container {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 30px;
				min-height: 100vh;
			}
			.trend-card {
				width: 300px;
				height: 400px;
				border: 1px solid #999;
				background: #fff;
				border-radius: 5%;
				display: inline-block;
				margin: auto;
			}
			.trend-img {
				width: 100%;
				height: 250px;
				background: #491c1c; /* 先用顏色代表圖片,之後可以換成 <img> */
			}
			h3 {
				text-align: center;
			}
		</style>
	</head>
	<body>
		<div id="container">
			<div class="trend-card">
				<div class="trend-img"></div>
				<h3>微醺酒紅</h3>
			</div>
			<div class="trend-card">
				<div class="trend-img" style="background: #d4a5a5"></div>
				<h3>精巧波點</h3>
			</div>
			<div class="trend-img" style="background: #8a6d6d"></div>
				<h3>核桃棕</h3>
			</div>
		</div>
	</body>
</html>
